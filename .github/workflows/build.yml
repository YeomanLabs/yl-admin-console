name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore YeomanLabs.AdminConsole.sln

      - name: Build
        run: dotnet build YeomanLabs.AdminConsole.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/YeomanLabs.AdminConsole.Core.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
